name: Security CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
            p/javascript
            p/typescript
            p/nodejs
            p/nextjs
            p/owasp-top-ten
            p/secrets

  npm-audit:
    name: SCA (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run npm audit
        run: npm audit --audit-level=high
      - name: Upload audit report
        if: always()
        run: npm audit --json > npm-audit-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 90

  trivy-fs:
    name: SCA (Trivy filesystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # package-lock.json is gitignored — install so Trivy can resolve npm deps.
      - name: Install dependencies
        run: npm install --ignore-scripts
      # Pin by commit SHA (v0.36.0) — Aqua retired bare 0.x tags after the Mar 2026 supply-chain incident.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          # vuln only — secrets are covered by Gitleaks; IaC by Checkov.
          scanners: vuln
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: .next,gitbook,coverage,.cache
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  checkov:
    name: IaC Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          # docker_compose framework was removed; compose files are yaml if needed later.
          framework: dockerfile
          quiet: true
          output_format: cli,sarif
          output_file_path: console,results.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
          category: checkov

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Requires Dependency graph (Settings → Code security and analysis). Soft-fail so
    # forks / repos without the feature don't red-bar the whole Security CI workflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  owasp-dependency-check:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ebrouter
          path: .
          format: JSON
          args: >
            --failOnCVSS 9
            --enableExperimental
            --suppression .github/dependency-check-suppressions.xml
            --exclude "**/.next/**"
            --exclude "**/gitbook/**"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: reports
          retention-days: 90

  oss-license-register:
    name: OSS License Register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate and validate license register
        run: node scripts/generate-license-register.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: oss-license-register
          path: docs/security/oss-license-register.generated.json
          retention-days: 90
